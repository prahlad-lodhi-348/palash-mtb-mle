name: palash_mtb_mle
description: PALASH MTB-MLE tablet application
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.29.0 <3.30.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^10.4.5
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  csv: ^6.0.0
  logger: ^2.4.0
  vosk_flutter: ^0.3.48
  flutter_tts: ^4.2.5
  flutter_onnxruntime: ^1.8.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/dictionaries/hindi_santhali_500.csv
    - assets/models/vosk-model-small-hi-0.22.zip
  fonts:
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf

dependency_overrides:
  permission_handler: ^11.3.1
  permission_handler_android: ^12.0.13
