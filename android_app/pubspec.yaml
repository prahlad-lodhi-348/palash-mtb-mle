name: palash_mtb_mle
description: PALASH MTB-MLE tablet application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  csv: ^6.0.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dictionaries/hindi_santhali_500.csv

  fonts:
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
dependencies:
  vosk_flutter: ^0.3.48
  permission_handler: ^11.3.1