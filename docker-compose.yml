services:
  nlp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palash-mtb-mle-nlp
    working_dir: /app
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: python nlp_models/export_onnx_indictrans2.py

volumes:
  hf_cache:
